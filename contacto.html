<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | TechNova Solutions</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS del proyecto -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Bootstrap Icons --> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

    <!-- =========================================
         NAVBAR - INTEGRANTE 1
    ========================================== -->
    <header>
        <!-- Navbar común del proyecto -->
    </header>


    <main>

        <!-- =========================================
             CONTACTO - INTEGRANTE 5
        ========================================== -->
        <section class="section">

            <div class="container-team">

                <h1 class="section-title text-center">
                    Contacto
                </h1>

                <p class="text-center mb-5">
                    ¿Tienes una pregunta o un proyecto en mente? Escríbenos, nuestro equipo te responderá a la brevedad.
                </p>

                <div class="row g-4 align-items-start">

                    <div class="col-lg-7">
                        <div class="card p-4">
                            <form id="form-contacto" novalidate>

                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
                                </div>

                                <div class="mb-3">
                                    <label for="correo" class="form-label">Correo</label>
                                    <input type="email" class="form-control" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
                                </div>

                                <div class="mb-3">
                                    <label for="asunto" class="form-label">Asunto</label>
                                    <input type="text" class="form-control" id="asunto" name="asunto" placeholder="Motivo de tu mensaje" required>
                                </div>

                                <div class="mb-3">
                                    <label for="mensaje" class="form-label">Mensaje</label>
                                    <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí" required></textarea>
                                </div>

                                <div id="contacto-feedback" class="mb-3"></div>

                                <button type="submit" class="btn btn-primary w-100">Enviar mensaje</button>

                            </form>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div class="card-team h-100">
                            <h5 class="mb-4" style="color: var(--color-primary);">Información de contacto</h5>

                            <div class="d-flex align-items-start mb-4">
                                <i class="bi bi-geo-alt-fill fs-4 me-3" style="color: var(--color-secondary);"></i>
                                <div>
                                    <strong>Oficina</strong>
                                    <p class="mb-0">Av. Tecnológica 123, Ambato, Ecuador</p>
                                </div>
                            </div>

                            <div class="d-flex align-items-start mb-4">
                                <i class="bi bi-envelope-fill fs-4 me-3" style="color: var(--color-secondary);"></i>
                                <div>
                                    <strong>Correo</strong>
                                    <p class="mb-0">contacto@technovasolutions.com</p>
                                </div>
                            </div>

                            <div class="d-flex align-items-start">
                                <i class="bi bi-telephone-fill fs-4 me-3" style="color: var(--color-secondary);"></i>
                                <div>
                                    <strong>Teléfono</strong>
                                    <p class="mb-0">+593 99 123 4567</p>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <script>
document.getElementById('form-contacto').addEventListener('submit', function (e) {
    e.preventDefault();

    const nombre = document.getElementById('nombre').value.trim();
    const correo = document.getElementById('correo').value.trim();
    const asunto = document.getElementById('asunto').value.trim();
    const mensaje = document.getElementById('mensaje').value.trim();
    const feedback = document.getElementById('contacto-feedback');
        if (!nombre || !correo || !asunto || !mensaje) {
        feedback.innerHTML = '<div class="alert alert-danger">Por favor completa todos los campos.</div>';
        return;
    }
        const regexCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!regexCorreo.test(correo)) {
        feedback.innerHTML = '<div class="alert alert-danger">Por favor ingresa un correo válido.</div>';
        return;
    }
        feedback.innerHTML = '<div class="alert alert-success">Tu mensaje fue enviado correctamente.</div>';
    this.reset();
});
</script>

            </div>

        </section>

    </main>


    <!-- =========================================
         FOOTER - INTEGRANTE 1
    ========================================== -->
    <footer>
        <!-- Footer común del proyecto -->
    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript del proyecto -->
    <script src="js/main.js"></script>

</body>

</html>
