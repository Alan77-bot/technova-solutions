<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | TechNova Solutions</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS del proyecto -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- =========================================
         NAVBAR - INTEGRANTE 1
    ========================================== -->
    <header>
        <!-- Navbar común del proyecto -->
    </header>


    <main>

        <!-- =========================================
             CONTACTO - INTEGRANTE 5
        ========================================== -->
        <section class="section">

            <div class="container-team">

                <h1 class="section-title">
                    Contacto
                </h1>

                <p>
                    Ponte en contacto con TechNova Solutions.
                </p>

               <div class="card p-4 mt-4">
    <form id="form-contacto">

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre completo">
        </div>

        <div class="mb-3">
            <label for="correo" class="form-label">Correo</label>
            <input type="email" class="form-control" id="correo" name="correo" placeholder="tucorreo@ejemplo.com">
        </div>

        <div class="mb-3">
            <label for="asunto" class="form-label">Asunto</label>
            <input type="text" class="form-control" id="asunto" name="asunto" placeholder="Motivo de tu mensaje">
        </div>

        <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí"></textarea>
        </div>

        <div id="contacto-feedback" class="mb-3"></div>

        <button type="submit" class="btn btn-primary">Enviar mensaje</button>

    </form>
</div>


                <!--
                    feature/validacion-contacto
                    Aquí se implementarán las validaciones.
                -->

            </div>

        </section>

    </main>


    <!-- =========================================
         FOOTER - INTEGRANTE 1
    ========================================== -->
    <footer>
        <!-- Footer común del proyecto -->
    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript del proyecto -->
    <script src="js/main.js"></script>

</body>

</html>
